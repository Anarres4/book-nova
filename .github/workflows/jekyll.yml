# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # Not ubuntu-latest: the pinned setup-ruby below does not recognise ubuntu-26.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Refuse to publish a Firebase config other than PROD
        # The moderation page must only ever name the PROD Firebase project (README, « Outil de
        # modération »); its DEV config lives in the gitignored _config.dev.yml. Every Firebase
        # identifier found in _site must be one of the PROD values below, which are public (they
        # are in _config.yml and in the app). The DEV values are never written here, and a failure
        # prints only file names: the logs of a public repository are public.
        shell: bash
        env:
          PROD_FIREBASE_IDS: |
            "projectId":"book-nova-prod"
            book-nova-prod.firebaseapp.com
            europe-west1-book-nova-prod.cloudfunctions.net
            AIzaSyDQsUU-N0S7SIW9INxeVUO5uzvWTeMtUVQ
            1:176379837545:web:3f27a636c2a621edd5b6f8
        run: |
          pattern='"projectId":"[^"]*"|[A-Za-z0-9.-]+\.firebaseapp\.com|[A-Za-z0-9.-]+\.cloudfunctions\.net|AIza[0-9A-Za-z_-]{35}|1:[0-9]+:web:[0-9a-f]+'
          found="$RUNNER_TEMP/firebase-ids.txt"
          # -a: binary files are searched too. Status 1 means no match; 2 or more is an error.
          status=0
          grep -rahoE -- "$pattern" _site > "$found" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::Could not search _site for Firebase identifiers (grep status $status): refusing to publish."
            exit 1
          fi
          printf '%s\n' "$PROD_FIREBASE_IDS" | sed '/^$/d' > "$RUNNER_TEMP/prod-ids.txt"
          unexpected=$(sort -u "$found" | grep -vxF -f "$RUNNER_TEMP/prod-ids.txt" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::_site names a Firebase project other than PROD: refusing to publish. Files:"
            while IFS= read -r id; do grep -rlaF -- "$id" _site; done <<< "$unexpected" | sort -u
            exit 1
          fi
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
