  privacyPage:
    title: "Política de Privacidad"
    intro:
      title: "Introducción"
      content: "Bienvenido a la política de privacidad de Book Nova. Valoramos tu privacidad. La aplicación guarda la mayor parte de tus datos en tu dispositivo. Si has aceptado el ajuste «Contribuir a estadísticas» (Configuración > Datos y privacidad), algunos datos se comparten a través de Firebase (Google Cloud), sin tu nombre, en particular para generar recomendaciones de lectura. Otros servicios reciben datos sin depender de este ajuste: aparecen en «Compartir datos». Una reseña solo se publica si la compartes, libro por libro: consulta «Reseñas públicas y cuenta de reseñas»."
    dataLocal:
      title: "Datos almacenados en tu dispositivo"
      intro: "La siguiente información permanece disponible sin conexión en tu dispositivo:"
      items:
        - "Biblioteca personal: títulos, autores, número de páginas, portadas, descripciones y progreso de lectura (si has aceptado «Contribuir a estadísticas», una parte se comparte, ver más abajo)."
        - "Ajustes personales: altura (opcional, usada solo para visualización lúdica de tu pila, nunca sincronizada), unidad de medida (cm/m), sistema (métrico/imperial), avatar, idiomas de lectura preferidos, géneros favoritos, preferencia por audiolibros"
        - "Desafíos e insignias: desafío elegido (solar/galaxia/universo), insignias desbloqueadas y progreso"
        - "Préstamos de libros: libros prestados o recibidos, con fechas y contactos"
        - "Preferencias de interfaz: idioma de la app (FR/EN/ES), tema (claro/oscuro), tipo de vista de biblioteca"
        - "Identificador del dispositivo: un identificador aleatorio creado por la app en el dispositivo, que también sirve como número de soporte"
      note: "Los datos se comparten sin tu nombre."
    usage:
      title: "Almacenamiento y tratamiento"
      items:
        - "Almacenamiento local: datos guardados en AsyncStorage y SecureStore para garantizar el acceso sin conexión."
        - "Compartir: si has aceptado «Contribuir a estadísticas», la app envía a Firebase los datos detallados en la siguiente sección."
        - "Alojamiento: los datos de Firebase (Firestore y funciones de servidor) se alojan en la Unión Europea."
    sync:
      title: "Compartir con «Contribuir a estadísticas»"
      intro: "Estos datos solo salen si has aceptado el ajuste «Contribuir a estadísticas» (Configuración > Datos y privacidad). Se comparten sin tu nombre:"
      items:
        - "Por cada libro terminado que tenga ISBN (salvo tus propias fotos de portada), sin identificador, visible para todos los usuarios en la página Descubrir, como máximo una vez por semana: título, autor, ISBN, portada, resumen, idioma, número de páginas, valoración (estrellas), categorías, hashtags y los totales de lectores y valoraciones."
        - "A partir de la versión 1.39.0, por libro, sin identificador, como máximo una vez al día: el número de lectores por estado (en curso, abandonado, por leer, por comprar) y el número de favoritos."
        - "Por dispositivo, bajo su identificador: tamaño de la biblioteca, número de libros terminados, número de libros por género (toda la biblioteca, registrado cada mes), última actividad, fecha de fin de la bienvenida en la app."
      purposesTitle: "Finalidades del tratamiento:"
      purposes:
        - "Crear recomendaciones de los libros más leídos, populares y mejor valorados"
        - "Elegir a quién enviar recordatorios (bienvenida terminada sin libros añadidos, sin actividad desde hace 7 días o más), a partir del tamaño de la biblioteca, la última actividad y la fecha de fin de la bienvenida"
        - "Entender las tendencias de lectura por género"
      retentionTitle: "Conservación:"
      retention:
        - "Mientras el uso compartido siga activo; después, eliminación a petición. No hay ninguna eliminación automática."
        - "Los totales de lectores y valoraciones por libro se conservan, porque no llevan identificador. Tu parte en los números de lectores por estado y de favoritos se retira si desactivas el ajuste."
    api:
      title: "Búsqueda de libros: ISBNdb y Google Books"
      intro: "Book Nova obtiene los metadatos públicos de los libros cuando tú:"
      items:
        - "Escaneas un código de barras ISBN"
        - "Buscas por título"
        - "Introduces un ISBN manualmente"
        - "Importas una biblioteca desde otra aplicación"
      routesTitle: "Por dónde pasan estas búsquedas:"
      routes:
        - "Una búsqueda por ISBN pasa primero por una caché compartida y una función de servidor propia (Firebase, Unión Europea), que consulta ISBNdb si hace falta. Si esa vía no está disponible, o si el código escaneado no es un ISBN válido, va directamente a ISBNdb."
        - "Una búsqueda por título va directamente a ISBNdb."
        - "Si ISBNdb rechaza la consulta o no responde, la app recurre a Google Books."
      data: "Datos enviados a ISBNdb: el ISBN, o el texto buscado y el idioma de búsqueda."
      limits: "Usuarios gratuitos: hasta 4 libros enriquecidos al día. Usuarios premium: sin límite."
      note: "Cuando la app recurre a Google Books, este recibe el ISBN, o el texto buscado y el idioma de búsqueda."
    notifications:
      title: "Notificaciones"
      intro: "Notificaciones locales, programadas en tu dispositivo, sin conexión a Internet:"
      items:
        - "Recordarte los libros prestados y recibidos en préstamo"
        - "Motivarte a leer (recordatorio mensual)"
        - "Avisarte antes de que termine la prueba gratuita"
      remoteTitle: "Notificaciones remotas"
      remote: "En cuanto autorizas las notificaciones, se guarda un token con nosotros en Firebase, junto con el identificador del dispositivo, la plataforma, la versión de la app y el idioma, hayas aceptado o no «Contribuir a estadísticas». Sirve para recordatorios y anuncios, enviados por el servicio Expo. Para no enviar demasiados recordatorios, también guardamos un registro de los ya enviados: identificador del dispositivo, tipo de recordatorio, número de envíos y fecha del último."
      note: "Las notificaciones, locales y remotas, se desactivan en los ajustes del teléfono."
    premium:
      title: "Versión premium - RevenueCat"
      intro: "Para las compras in-app, RevenueCat gestiona las suscripciones. Solo le transmitimos:"
      items:
        - "El identificador de tu dispositivo: un identificador aleatorio creado por la app en el dispositivo, que también sirve como número de soporte"
        - "Estado de la suscripción (activa/inactiva)"
        - "Detalles de la transacción gestionados por App Store o Google Play"
      note: "Book Nova nunca accede a tus datos de pago."
    messages:
      title: "Mensajes y sugerencias"
      items:
        - "Formulario de contacto, enviado por correo electrónico: tipo de mensaje y texto, correo electrónico y capturas de pantalla si las añades, número de soporte, plataforma, versión y número de compilación de la app, versión del sistema."
        - "Comentarios guardados en Firebase, sin identificador: texto, plataforma, versión de la app y del sistema, modelo del teléfono. Esto incluye el texto libre escrito en algunas preguntas de la bienvenida."
        - "Sugerencias de iconos, guardadas en Firebase, sin identificador: texto, plataforma y versión de la app."
    reviews:
      title: "Reseñas públicas y cuenta de reseñas"
      intro: "Compartir una reseña es opcional y se hace libro por libro: no se publica nada si no tocas «Compartir mi reseña con la comunidad». Hay que tener 15 años o más, o el permiso de tu madre, padre o tutor."
      items:
        - "Lo que se publica, visible para todos los usuarios de Book Nova: el texto de la reseña, la valoración sobre 5 si diste una, el mes de lectura, la mención spoiler, las fechas de publicación y de modificación, y un seudónimo elegido al azar (como «Búho 4271»). No se publican ni tu nombre, ni tu número de soporte, ni tu dirección IP."
        - "La cuenta de reseñas: compartir una primera reseña, o hacer una primera denuncia, crea una cuenta sin nombre, sin correo y sin contraseña. La gestiona Firebase Authentication (Google), que trata su identificador, sus fechas de creación y de conexión y la dirección IP de conexión en Estados Unidos."
        - "Con cada publicación, la app envía también tu número de soporte: solo guardamos una huella de él, que nos sirve para reconocer tu cuenta cuando nos escribes con ese número."
        - "Revisión automática: al publicarse, el texto de cada reseña se envía a Google Cloud Natural Language, en Europa, que detecta comentarios insultantes u odiosos."
        - "El expediente del autor, en nuestros servidores: tu seudónimo, la versión de las normas que aceptaste, el estado y el motivo de cada una de tus reseñas y, si corresponde, una suspensión y el número de denuncias recibidas. No se borra automáticamente."
        - "Las denuncias: el motivo, los detalles, y el nombre y el correo si quien denuncia los da, con la antigüedad de su cuenta y una huella del inicio de su dirección IP. Una reseña denunciada u ocultada se guarda con esas denuncias en nuestra cola de moderación hasta 12 meses después de su última actividad."
        - "El registro de reseñas: por cada publicación, modificación, eliminación o restablecimiento, la dirección IP, el protocolo, la fecha, el tipo de operación, la referencia de la reseña y el identificador de la cuenta, sin el texto. Se conserva un año."
        - "Los límites contra abusos cuentan las publicaciones y las denuncias por cuenta y por huella del inicio de la dirección IP. Estos contadores se borran a los dos días."
        - "En tu teléfono: la Reseña final y su ajuste para compartir, la lista de lectores que ocultaste, la de spoilers que denunciaste y el seguimiento de tus reseñas compartidas. Estas listas no se envían ni se exportan."
        - "Mixpanel recibe mediciones sobre las reseñas (longitud del texto, mención spoiler, motivo de un rechazo o de una denuncia), nunca su texto."
      note: "Una reseña sigue en línea hasta que la retires. Desinstalar la app no la borra: retira tus reseñas en Configuración › Datos y privacidad › Mis reseñas públicas, una a una o todas a la vez, o escríbenos. La cuenta de reseñas no se borra automáticamente: escríbenos para que la borremos."
      linkText: "El funcionamiento completo de las reseñas:"
    sharing:
      title: "Compartir datos"
      intro: "No vendemos ni intercambiamos tus datos. Solo los transmitimos en estos casos:"
      items:
        - "Firebase (Google Cloud): alojamiento, en la Unión Europea, de los datos descritos en esta página (estadísticas compartidas, reseñas públicas y moderación, búsqueda por ISBN, tokens de notificación, registro de recordatorios, comentarios, sugerencias de iconos)"
        - "Firebase Authentication (Google): la cuenta de reseñas, tratada en Estados Unidos"
        - "Google Cloud Natural Language: revisión automática del texto de las reseñas, en Europa"
        - "ISBNdb: recuperar metadatos públicos durante tus búsquedas"
        - "RevenueCat: gestionar la versión premium"
        - "Mixpanel: mediciones de uso bajo el identificador del dispositivo, incluidas las respuestas a las preguntas de la bienvenida, los géneros favoritos, títulos de libros (por ejemplo, un libro terminado o compartido), nombres de colecciones y categorías, y el contenido de un código de barras que no sea un ISBN. Envío a sus servidores europeos."
        - "Sentry: informes de fallos, mediciones de rendimiento y contexto técnico del dispositivo, bajo su identificador. Envío a sus servidores europeos."
        - "TikTok: atribución publicitaria, bajo el identificador del dispositivo: instalación, fin de la bienvenida, géneros favoritos elegidos, prueba y compra (importe y moneda). En Android, su SDK también lee el identificador publicitario de Google."
        - "Google Books: búsqueda de libros"
        - "Expo: envío de las notificaciones remotas y actualizaciones de la app"
        - "Web3Forms: mensajes del formulario de contacto"
        - "ImgBB: capturas de pantalla adjuntas a esos mensajes, eliminadas automáticamente después de 30 días"
        - "Obligaciones legales: cuando la ley lo requiera"
      independent: "Mixpanel, Sentry y TikTok no dependen del ajuste «Contribuir a estadísticas»: desactivarlo no los detiene."
      outsideEu: "Firebase Authentication trata la cuenta de reseñas en Estados Unidos. TikTok, RevenueCat, ISBNdb, Google Books, Expo, Web3Forms e ImgBB pueden tratar estos datos fuera de la Unión Europea."
    website:
      title: "Este sitio web"
      items:
        - "Píxel de TikTok: cada página de este sitio carga el píxel publicitario de TikTok. Registra la página vista y los clics hacia App Store y Google Play, para medir nuestros anuncios."
        - "Cookie: si llegas desde un anuncio de TikTok (enlace con «ttclid»), ese código se guarda 30 días en una cookie."
        - "Bootstrap: los archivos de diseño se cargan desde jsDelivr."
    security:
      title: "Seguridad y almacenamiento"
      items:
        - "SecureStore cifra tu altura y el identificador del dispositivo con la seguridad nativa de iOS/Android"
        - "Firebase cifra los datos sincronizados en tránsito y en reposo (Google Cloud)"
        - "Los datos de Firebase (Firestore y funciones de servidor) se alojan en la Unión Europea"
        - "Tus libros, préstamos y ajustes siguen disponibles sin conexión en tu dispositivo"
        - "Las copias de seguridad dependen de iCloud o Google Drive según tu sistema"
      warning: "Importante: si eliminas la app sin una copia de seguridad del sistema, perderás definitivamente los datos de tu dispositivo."
    rights:
      title: "Tus derechos"
      consent: "La elección de compartir en la bienvenida de la app es explícita: nada viene marcado de antemano. Si habías aceptado compartir antes de la versión 1.39.0, la app te lo vuelve a preguntar una vez: hasta que confirmes, tus estados y favoritos no se cuentan."
      intro: "En cualquier momento puedes:"
      items:
        - "Consultar tus datos directamente en la app"
        - "Modificar la información desde la interfaz"
        - "Retirar el consentimiento para notificaciones en los ajustes del dispositivo"
        - "Desactivar «Contribuir a estadísticas» (Configuración > Datos y privacidad): esto detiene el uso compartido y retira del recuento los estados de lectura y los favoritos del dispositivo, en el siguiente inicio si está sin conexión"
        - "Solicitar la eliminación de las cifras vinculadas al dispositivo escribiendo a book-nova@outlook.fr, con tu número de soporte (Configuración > Soporte)"
        - "Retirar tus reseñas públicas, una a una o todas a la vez, en Configuración › Datos y privacidad › Mis reseñas públicas"
        - "Presentar una reclamación ante la CNIL"
      note: "Desinstalar la aplicación borra los datos del teléfono, no lo que ya se ha compartido. Antes de desinstalar, deja de compartir."
    permissions:
      title: "Permisos solicitados"
      items:
        - "Cámara: escanear códigos de barras ISBN y hacer fotos (portada, préstamo, compartir)"
        - "Fotos: elegir una imagen (portada, captura adjunta a un mensaje)"
        - "Notificaciones: mostrar recordatorios locales y recibir recordatorios y anuncios remotos"
        - "Almacenamiento local: guardar libros y preferencias"
        - "Acceso a la red: buscar libros e intercambiar datos con los servicios indicados en «Compartir datos»"
        - "Identificador publicitario (Android): atribución publicitaria de TikTok"
      note: "Estos permisos no se usan para recopilar datos sin tu conocimiento."
    changes:
      title: "Cambios en esta política"
      content: "Podemos actualizar esta política en cualquier momento. Revísala con frecuencia."
    contact:
      title: "Contacto"
      content: "Si tienes dudas sobre tus datos o esta política, escríbenos a:"
      email: "book-nova@outlook.fr"
    summary:
      title: "Resumen rápido"
      items:
        - "Tus datos siguen disponibles sin conexión en tu dispositivo"
        - "Si aceptas «Contribuir a estadísticas» (nada viene marcado de antemano), se comparten datos sin tu nombre a través de Firebase, donde se alojan en la Unión Europea: por libro sin identificador, por dispositivo bajo su identificador"
        - "Este identificador es un identificador aleatorio creado por la app en el dispositivo, que también sirve como número de soporte"
        - "Mixpanel, Sentry y TikTok no dependen de este ajuste y reciben datos bajo el identificador del dispositivo"
        - "Las búsquedas de libros pasan por ISBNdb, por nuestra función de servidor para las búsquedas por ISBN, y por Google Books como alternativa"
        - "RevenueCat gestiona la versión premium, Expo envía las notificaciones remotas y las actualizaciones, Web3Forms e ImgBB tratan los mensajes de contacto y sus capturas de pantalla"
        - "TikTok, RevenueCat, ISBNdb, Google Books, Expo, Web3Forms e ImgBB pueden tratar estos datos fuera de la Unión Europea"
        - "Desactivar el ajuste detiene el uso compartido y retira del recuento los estados de lectura y los favoritos del dispositivo. Las cifras vinculadas al dispositivo se eliminan a petición en book-nova@outlook.fr, con el número de soporte. Puedes presentar una reclamación ante la CNIL"
        - "Este sitio carga el píxel publicitario de TikTok"
        - "Una reseña solo se publica si la compartes: es pública, firmada con un seudónimo, y su cuenta la gestiona Firebase Authentication en Estados Unidos"
    lastUpdated: "Última actualización: 04/11/2026"
    backToHome: "Volver al inicio"
  reviewsPage:
    title: "Cómo funcionan las reseñas"
    intro: "Esta página explica cómo funcionan las reseñas públicas de Book Nova: de dónde vienen, cómo se revisan y se muestran, cuánto tiempo permanecen en línea y cómo denunciarlas."
    origin:
      title: "De dónde vienen las reseñas"
      items:
        - "Una reseña es la Reseña final de un libro que su autor marcó como «Leído» y que decidió compartir, libro por libro, con «Compartir mi reseña con la comunidad»."
        - "Para compartir, el libro necesita un ISBN y una fecha de fin de lectura, y la reseña al menos 20 caracteres. Hay que aceptar las normas de abajo y tener 15 años o más, o el permiso de tu madre, padre o tutor."
        - "Un lector publica como máximo una reseña por libro. Las reseñas van unidas al título y al autor del libro: las ediciones con el mismo título comparten las mismas reseñas, y una traducción con otro título tiene las suyas."
        - "Compartir una reseña es gratis, en la versión gratuita como en la premium."
      note: "Ni la lectura ni la compra del libro se verifican. Ninguna reseña se paga ni se recompensa, y no escribimos reseñas en lugar de los lectores."
    display:
      title: "Qué se muestra"
      items:
        - "En la ficha de un libro, en Descubrir, bajo «Reseñas de lectores»: el texto, la valoración sobre 5 si el autor dio una, el mes de lectura, la fecha de publicación, la mención «editada» si el texto o la valoración cambiaron, y el seudónimo del autor."
        - "El seudónimo se elige al azar, como «Búho 4271». Es el mismo para todas las reseñas de un lector mientras conserve su cuenta: reinstalar la app, o «Empezar con una cuenta nueva», asigna uno nuevo. No contiene ni su nombre ni su número de soporte."
        - "Orden: en la ficha, tu reseña primero y luego las más recientes; en «Ver las N reseñas», todas las reseñas, la tuya incluida, de la más reciente a la más antigua. «Ocultar spoilers» quita de esa lista las reseñas que los contienen."
        - "Una reseña marcada como spoiler, por su autor o tras una denuncia, sigue en línea, pero su texto solo se muestra tras «Mostrar de todos modos»."
        - "No es posible contactar con el autor de una reseña desde Book Nova."
    control:
      title: "La revisión antes de publicar"
      intro: "Cada reseña pasa una revisión automática al publicarse, sin lectura previa por una persona. Se rechaza si:"
      items:
        - "tiene menos de 20 caracteres o más de 2000;"
        - "contiene un enlace, un correo electrónico, un @usuario, un número de teléfono, un número de soporte o una serie de 9 cifras o más, ISBN incluidos;"
        - "contiene un carácter invisible que invierte el sentido del texto;"
        - "contiene comentarios insultantes u odiosos, detectados por un filtro automático (Google Cloud Natural Language, en Europa);"
        - "no tiene fecha de fin de lectura, o trata de un libro que no puede recibir reseñas."
      note: "Un rechazo nunca es silencioso: la app muestra el motivo, y tu texto nunca se modifica. El filtro no distingue un insulto a un personaje de un insulto a una persona: ambos se rechazan. Para evitar abusos, una misma cuenta puede publicar o modificar como máximo 5 reseñas por hora y 20 al día, y una cuenta suspendida ya no puede publicar."
    delays:
      title: "Plazos de publicación y conservación"
      items:
        - "Publicación: en cuanto la reseña pasa la revisión automática. Sin red, se envía al volver la conexión; si la revisión no está disponible por un momento, la app lo vuelve a intentar más tarde."
        - "Conservación: una reseña publicada sigue en línea hasta que su autor la retire, sin límite de tiempo. Desinstalar la app no la borra."
        - "Una reseña denunciada, ocultada o retirada por la moderación se guarda en nuestra cola de moderación hasta 12 meses después de su última actividad, para permitir impugnar la decisión."
        - "Un registro de cada publicación, modificación y eliminación (dirección IP, fecha, tipo de operación, identificador de la cuenta, sin el texto) se conserva un año."
    edit:
      title: "Modificar o retirar tu reseña"
      items:
        - "Modificar: cambia tu Reseña final o las estrellas del libro y guarda. En la ficha, el menú «…» de tu reseña también ofrece «Editar» y «Marcar como spoiler». La reseña en línea se sustituye tras una nueva revisión automática."
        - "Una reseña ocultada por la moderación sigue oculta tras una modificación: vuelve a revisión."
        - "Retirar: «Retirar» en el menú «…» de tu reseña; vuelve a tocar el botón para compartir de la Reseña final y guarda; vacía la Reseña final; borra el libro; o ve a Configuración › Datos y privacidad › Mis reseñas públicas, donde también puedes borrar todas tus reseñas de una vez."
        - "Tu Reseña final siempre se queda en tu teléfono."
        - "Tras reinstalar la app o en un teléfono nuevo, puede que la app ya no pueda retirar tus reseñas antiguas, y tu número de soporte puede haber cambiado: escríbenos con tu seudónimo y los libros afectados, y las retiraremos."
    reports:
      title: "Denunciar una reseña o a un lector"
      intro: "Desde el menú «…» de una reseña, puedes denunciar la reseña, denunciar a su autor u ocultar sus reseñas solo para ti. Un lector oculto se recupera en Mis reseñas públicas › Lectores ocultos › «Dejar de ocultar»."
      items:
        - "Motivos: spoiler, odio o acoso, insulto o contenido ofensivo, información personal, spam o publicidad, reseña falsa, otro contenido ilegal, otro."
        - "Puedes añadir detalles, obligatorios para «otro contenido ilegal», así como tu nombre y tu correo electrónico, opcionales. Una casilla te pide confirmar que denuncias de buena fe. Si dejas un correo, te respondemos con nuestra decisión."
        - "Cada denuncia la examina una persona de nuestro equipo en un plazo de 24 horas."
        - "Mientras tanto, algunas denuncias ocultan la reseña de forma provisional: un spoiler denunciado oculta su texto; la información personal denunciada oculta la reseña para todos; otro abuso la oculta tras las denuncias de dos lectores distintos. Solo las cuentas creadas hace más de 24 horas activan esta ocultación. Una reseña solo se retira tras nuestra revisión."
        - "Denunciar a un lector no oculta nada: la denuncia nos llega a nosotros."
    decisions:
      title: "Decisiones e impugnación"
      items:
        - "Tras revisarla, restablecemos la reseña, la retiramos o suspendemos a su autor durante un tiempo determinado. Una reseña restablecida ya no puede ocultarse automáticamente."
        - "El autor ve en la app por qué su reseña se rechaza, se oculta o se retira, y si la decisión es automática y provisional."
        - "Puede impugnarla con el botón «Impugnar», que prepara un correo, o escribiéndonos con la referencia de la reseña."
        - "Tanto el autor de la reseña como la persona que la denunció pueden acudir también a los tribunales."
    rules:
      title: "Las normas"
      items:
        - "Nada de insultos ni comentarios de odio, hacia nadie, personajes incluidos."
        - "Nada de información personal, ni tuya ni de otros: ni nombres, ni datos de contacto, ni enlaces."
        - "Avisa a los lectores cuando tu reseña revele la trama."
      note: "Son las normas aceptadas al compartir por primera vez. También se aplican las condiciones de uso de Book Nova."
    ratings:
      title: "Las valoraciones de los libros"
      content: "La valoración media y el reparto de valoraciones de una ficha de Descubrir vienen de los lectores que terminaron el libro y aceptaron «Contribuir a estadísticas». Cada dispositivo cuenta una vez por libro, sin tu nombre. Cada teléfono envía sus valoraciones como máximo una vez por semana, con wifi: una valoración puede tardar unos días en contar. Estas valoraciones tampoco se verifican."
    contact:
      title: "Contenido ilegal, urgencias y contacto"
      items:
        - "Para denunciar un contenido ilegal, impugnar una decisión o para las autoridades: book-nova@outlook.fr."
        - "Si la vida o la seguridad de alguien está amenazada, llama al 112 (o al 17 en Francia)."
        - "Para denunciar un contenido ilegal ante las autoridades francesas: Pharos, en internet-signalement.gouv.fr."
        - "Respondemos en francés, inglés y español."
    links:
      title: "Para saber más"
    lastUpdated: "Última actualización: 05/11/2026"
