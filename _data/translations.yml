  reviewsPage:
    title: "How reviews work"
    intro: "This page explains how Book Nova's public reviews work: where they come from, how they are checked and displayed, how long they stay online, and how to report them."
    origin:
      title: "Where reviews come from"
      items:
        - "A review is the Final review of a book its author marked as “Read”, which they chose to share, book by book, with “Share my review with the community”."
        - "To share, the book needs an ISBN and a finish date, and the review at least 20 characters. You must accept the rules below and be 15 or older, or have a parent's permission."
        - "A reader publishes at most one review per book. Reviews are tied to the book's title and author: editions with the same title share the same reviews, and a translation with a different title has its own."
        - "Sharing a review is free, on the free version as on premium."
      note: "Neither the reading nor the purchase of the book is verified. No review is paid for or rewarded, and we do not write reviews in readers' place."
    display:
      title: "What is displayed"
      items:
        - "On a book's sheet, in Discover, under “Readers’ reviews”: the text, the rating out of 5 if the author gave one, the month of reading, the publication date, the “edited” mention if the text or rating changed, and the author's pseudonym."
        - "The pseudonym is drawn at random, like “Owl 4271”. It stays the same for all of a reader's reviews as long as they keep their account: a reinstall, or “Start over with a new account”, draws a new one. It contains neither their name nor their support number."
        - "Order: on the sheet, your review first, then the newest; in “See all N reviews”, every review, yours included, from newest to oldest. “Hide spoilers” removes reviews that contain them from that list."
        - "A review marked as a spoiler, by its author or after a report, stays online, but its text only appears after “Show anyway”."
        - "You cannot contact the author of a review through Book Nova."
    control:
      title: "Checks before publication"
      intro: "Each review goes through an automatic check when it is published, with no prior reading by a person. It is refused if it:"
      items:
        - "is shorter than 20 characters or longer than 2,000;"
        - "contains a link, an email address, an @name, a phone number, a support number or a run of 9 digits or more, ISBNs included;"
        - "contains an invisible character that reverses the text direction;"
        - "contains insulting or hateful remarks, detected by an automatic filter (Google Cloud Natural Language, in Europe);"
        - "has no finish date, or concerns a book that cannot receive reviews."
      note: "A refusal is never silent: the app shows its reason, and your text is never altered. The filter cannot tell an insult to a character from an insult to a person: both are refused. To prevent abuse, one account can publish or edit at most 5 reviews an hour and 20 a day, and a suspended account can no longer publish."
    delays:
      title: "Publication and retention times"
      items:
        - "Publication: as soon as the review passes the automatic check. Without a network, it is sent when the connection returns; if the check is briefly unavailable, the app tries again later."
        - "Retention: a published review stays online until its author withdraws it, with no time limit. Uninstalling the app does not delete it."
        - "A review that was reported, hidden or removed by moderation is kept in our moderation queue for up to 12 months after its last activity, so that a decision can be disputed."
        - "A log of each publication, edit and deletion (IP address, date, type of operation, account identifier, without the text) is kept for one year."
    edit:
      title: "Editing or withdrawing your review"
      items:
        - "Edit: change your Final review or the book's stars, then save. On the sheet, your review's “…” menu also offers “Edit” and “Mark as a spoiler”. The online review is replaced after a new automatic check."
        - "A review hidden by moderation stays hidden after an edit: it goes back for review."
        - "Withdraw: “Withdraw” in your review's “…” menu; tap the Final review's share button again, then save; clear the Final review; delete the book; or go to Settings › Data & Privacy › My public reviews, which also lets you delete all your reviews at once."
        - "Your Final review always stays on your phone."
        - "After a reinstall or on a new phone, the app may no longer be able to withdraw your old reviews, and your support number may have changed: write to us with your pseudonym and the books concerned, and we will remove them."
    reports:
      title: "Reporting a review or a reader"
      intro: "From a review's “…” menu, you can report the review, report its author, or hide their reviews for yourself only. A hidden reader can be restored in My public reviews › Hidden readers › “Unhide”."
      items:
        - "Reasons: spoiler, hate or harassment, insult or offensive content, personal information, spam or advertising, fake review, other illegal content, other."
        - "You can add details, required for “other illegal content”, as well as your name and email address, both optional. A box asks you to confirm that you are reporting in good faith. If you leave an address, we reply with our decision."
        - "Each report is examined by a person from our team within 24 hours."
        - "Meanwhile, some reports hide the review provisionally: a reported spoiler hides its text; reported personal information hides the review for everyone; another kind of abuse hides it after reports from two different readers. Only accounts created more than 24 hours ago trigger this hiding. A review is only removed after we have checked it."
        - "Reporting a reader hides nothing: the report is passed on to us."
    decisions:
      title: "Decisions and disputes"
      items:
        - "After checking, we restore the review, remove it, or suspend its author for a set time. A restored review can no longer be hidden automatically."
        - "The author sees in the app why their review is refused, hidden or removed, and whether the decision is automatic and provisional."
        - "They can dispute it with the “Dispute” button, which prepares an email, or by writing to us with the review's reference."
        - "Both the author of the review and the person who reported it can also go to court."
    rules:
      title: "The rules"
      items:
        - "No insults or hateful remarks, about anyone, characters included."
        - "No personal information, yours or anyone else's: no names, contact details or links."
        - "Let readers know when your review reveals the plot."
      note: "These are the rules accepted at the first share. Book Nova's Terms of Use also apply."
    ratings:
      title: "Book ratings"
      content: "The average rating and the rating breakdown on a Discover sheet come from readers who finished the book and accepted “Contribute to statistics”. Each device counts once per book, without your name. Each phone sends its ratings at most once a week, on Wi-Fi: a rating can take a few days to count. These ratings are not verified either."
    contact:
      title: "Illegal content, emergencies and contact"
      items:
        - "To report illegal content, dispute a decision, or for the authorities: book-nova@outlook.fr."
        - "If someone's life or safety is under threat, call 112 (or 17 in France)."
        - "To report illegal content to the French authorities: Pharos, at internet-signalement.gouv.fr."
        - "We reply in French, English and Spanish."
    links:
      title: "Learn more"
