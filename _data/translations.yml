  termsPage:
    title: "Terms of Use"
    sections:
      acceptance:
        title: "1. Acceptance of the Terms"
        body: "By downloading, installing, or using the Book Nova application (the 'App'), you agree to be bound by these Terms of Use. If you do not agree, do not use the App. These terms apply to all users of both the free and premium versions."
      service:
        title: "2. Service Description"
        body: "Book Nova is a personal library management mobile app that lets you:"
        items:
          - "Manage your collection of books while tracking reading progress"
          - "Visualize the height of your book stack based on your own height"
          - "Scan ISBN barcodes to automatically retrieve book information"
          - "Track books you lend or borrow"
          - "Create custom collections, take reading notes, and write a final note on finished books"
          - "Unlock badges and take on reading challenges"
          - "View personalized statistics and receive recommendations updated regularly"
        note: "The App works offline for most actions. If you accepted the “Contribute to statistics” setting, it shares some data through Firebase (Google Cloud), without your name, in particular to generate these recommendations. Details are in the Privacy Policy."
      usage:
        title: "3. Using the App"
        allowed:
          title: "3.1 Permitted Use"
          body: "You agree to use Book Nova only for lawful personal purposes, including:"
          items:
            - "Managing your personal library"
            - "Tracking your reading and progress"
            - "Managing book loans with friends and family"
            - "Reviewing your statistics and unlocking badges"
        prohibited:
          title: "3.2 Prohibited Use"
          body: "It is strictly forbidden to use the App to:"
          items:
            - "Violate intellectual property rights (piracy or illegal sharing of protected content)"
            - "Automate massive requests to the ISBNdb API (scraping or abusing the API)"
            - "Modify, decompile, disassemble, or create derivative works of the App"
            - "Bypass free-plan limitations (4 books per day)"
            - "Use third-party tools to unlock premium features artificially"
            - "Damage, disable, or overload the App or the ISBNdb API"
      userData:
        title: "4. User Data and Content"
        ownership:
          title: "4.1 Ownership of Your Data"
          body: "You retain full rights to the data you enter in the App, including:"
          items:
            - "Book titles, authors, and personal notes"
            - "Details about books you lend or borrow"
            - "Reading progress and personalized statistics"
            - "Avatar choices and personalized settings"
          note: "Your data stays accessible on your device. What is shared, and with whom, is set out in the Privacy Policy."
        responsibility:
          title: "4.2 Responsibility for Content"
          body: "You alone are responsible for the accuracy and legality of the information you enter. We are not liable for data-entry errors or disputes between users over lent books."
        backup:
          title: "4.3 Backing Up Your Data"
          body: "The App stores your information locally. Please keep your own iCloud/Google Drive backups. Uninstalling the app erases the data on your phone, not what has already been shared: before uninstalling, turn off “Contribute to statistics”, then write to us with your support number to delete the figures tied to your device."
        reviews:
          title: "4.4 Public Reviews"
          body: "You can share the Final review of a finished book as a public review, book by book. Sharing a review requires being 15 or older, or having a parent's permission, and accepting the review rules."
          items:
            - "Licence: you remain the owner of your reviews. By sharing a review, you allow Book Nova to display it in the App, free of charge and non-exclusively, for as long as it is online. Any other use, outside the App, will require your consent."
            - "Rules: no insults or hateful remarks, about anyone, characters included; no personal information, yours or anyone else's; let readers know when a review reveals the plot. Fake reviews, advertising and any illegal content are also forbidden."
            - "Zero tolerance: we do not tolerate any objectionable content or abusive behaviour."
            - "Moderation: an automatic filter checks each review before it is published, and readers can report a review or its author. We may hide or remove a review that breaks these rules, and suspend an account's ability to publish for a set time."
            - "Responsibility: you are responsible for the content of your reviews."
            - "Withdrawal: you can withdraw your reviews at any time. Uninstalling the App does not delete them."
          note: "Checks, reports, timing and disputes are detailed on the page “How reviews work”."
      isbndb:
        title: "5. ISBNdb API and Metadata"
        thirdParty:
          title: "5.1 Third-Party Service"
          body: "Book Nova relies on the ISBNdb API to fetch public book metadata. We are not responsible for:"
          items:
            - "The availability or interruptions of the ISBNdb API"
            - "The accuracy of the data provided by ISBNdb"
        limits:
          title: "5.2 Free Plan Limits"
          body: "Free users are limited to 4 books added per day, 4 custom collections, 3 reading notes, and up to 3 simultaneous loans/borrows. The total number of books and the final note on finished books remain unlimited. Premium subscribers are not subject to these limits (unlimited custom collections and reading notes)."
      accounts:
        title: "6. Accounts and Authentication"
        noAccount:
          title: "6.1 No Account Required"
          body: "The App does not require you to create an account. It uses a random identifier created by the app on the device, which also serves as your support number. Sharing or reporting a review creates a reviews account, with no name, email or password, managed by Firebase Authentication."
        uuid:
          title: "6.2 Device Identifier (UUID)"
          body: "This random identifier (UUID) is generated locally and is used in particular to:"
          items:
            - "Manage your premium subscription status through RevenueCat"
            - "Tie shared statistics to your device, if you accepted “Contribute to statistics”"
            - "Send remote notifications, measure usage (Mixpanel), receive crash reports (Sentry) and attribute installs to ads (TikTok), whether or not this setting is accepted"
          note: "This identifier contains neither your name nor your email address. It also lets you request deletion of the figures tied to your device."
      premium:
        title: "7. Premium Subscription and In-App Purchases"
        features:
          title: "7.1 Premium Features"
          body: "The premium version unlocks:"
          items:
            - "Unlimited metadata validations via ISBNdb"
            - "Unlimited book additions each day"
            - "Unlimited custom collections"
            - "Unlimited reading notes"
            - "Basic reading stats (monthly/yearly)"
            - "Advanced detailed statistics"
            - "Access to exclusive challenges and badges."
            - "Unlimited access to Discover page recommendations."
        trial:
          title: "7.2 Trial Period"
          body: "The 14-day free trial is only available once per account. Once used, it cannot be reactivated."
        processing:
          title: "7.3 Purchase Processing"
          body: "In-app purchases are processed by:"
          items:
            - "Apple App Store (iOS)"
            - "Google Play Store (Android)"
          note: "These purchases are subject to each platform's terms. RevenueCat securely manages your subscriptions."
        refunds:
          title: "7.4 Refund Policy"
          body: "Refund requests must be submitted directly to Apple or Google. Book Nova cannot process refunds on your behalf."
        cancellation:
          title: "7.5 Cancelling Your Subscription"
          body: "You can cancel your premium subscription at any time through your Apple or Google account settings. Cancellation takes effect at the end of the current billing period."
      notifications:
        title: "8. Notifications"
        body: "The App can send local notifications and, through the Expo service, remote notifications to:"
        items:
          - "Remind you of books lent and borrowed"
          - "Encourage you to use the App (monthly reminder)"
          - "Warn you before the free trial ends"
          - "Send you reminders and announcements (remote notifications)"
        note: "You can turn them off in your device settings."
      intellectualProperty:
        title: "9. Intellectual Property"
        rights:
          title: "9.1 Rights in the App"
          body: "The App, its code, design, graphics, and content are the exclusive property of Book Nova and are protected by intellectual property laws."
        license:
          title: "9.2 License to Use"
          body: "We grant you a non-exclusive, non-transferable, revocable license to use the App for personal purposes. This license does not allow you to:"
          items:
            - "Copy, modify, or distribute the App"
            - "Use the App commercially without authorization"
            - "Extract or reuse elements of the App (code, design, badges)"
        metadata:
          title: "9.3 Book Metadata"
          body: "Book metadata comes from public sources such as ISBNdb and remains subject to the rights of their respective owners (publishers and authors)."
      liability:
        title: "10. Limitation of Liability"
        asIs:
          title: "10.1 Provided 'as is'"
          body: "The App is provided 'as is' without express or implied warranties. We do not warrant that:"
          items:
            - "The App will be free of errors or bugs"
            - "The service will be continuously available"
            - "ISBNdb data will always be accurate or up to date"
        limit:
          title: "10.2 Liability Limits"
          body: "To the fullest extent permitted by law, Book Nova will not be liable for:"
          items:
            - "Data loss caused by deleting the App or device failure"
            - "Disputes between users regarding unreturned books"
            - "Errors in metadata supplied by ISBNdb"
            - "Interruptions or malfunctions of the ISBNdb API"
            - "Any indirect, consequential, or punitive damages"
      modifications:
        title: "11. Changes to the App and Terms"
        app:
          title: "11.1 App Updates"
          body: "We reserve the right to:"
          items:
            - "Modify, enhance, or remove features"
            - "Adjust free-plan limits with 30 days' notice"
        terms:
          title: "11.2 Updates to the Terms"
          body: "We may change these Terms at any time. Updates take effect when published in the App or on our website."
          note: "Continuing to use the App after changes means you accept the new terms."
      termination:
        title: "12. Termination"
        user:
          title: "12.1 Termination by the User"
          body: "You may stop using the App at any time by deleting it. If you have a premium subscription, cancel it through Apple or Google to avoid renewals."
      contact:
        title: "13. Contact"
        body: "If you have any questions about these Terms of Use, contact us at:"
        email: "book-nova@outlook.fr"
      jurisdiction:
        title: "14. Applicable Law and Jurisdiction"
        body: "These Terms of Use are governed by French law. Any dispute relating to their interpretation or execution falls under the exclusive jurisdiction of French courts."
      generalProvisions:
        title: "15. General Provisions"
        body: "If any provision of these Terms is found to be invalid or unenforceable, the remaining provisions will remain in full force and effect."
    summary:
      title: "Quick Summary"
      items:
        - "Personal and lawful use only"
        - "Your data stays accessible on your device; if you accept “Contribute to statistics”, some of it is shared through Firebase, without your name"
        - "Free plan: 4 books added per day, unlimited total books"
        - "Premium plan: unlimited daily additions"
        - "Purchases handled by Apple/Google; refunds handled by them"
        - "App provided 'as is' with limited liability"
        - "No account required; a random device identifier is used for premium, shared statistics, notifications, usage measurement and advertising attribution"
        - "Public reviews: shared only if you ask, book by book, subject to the review rules and withdrawable at any time"
