    q10: "¿Qué es la página Descubrir?"
    a10: |-
      La página Descubrir te ofrece recomendaciones de libros personalizadas basadas en tus lecturas y preferencias.

      📱 VERSIÓN GRATUITA:
      - 20 recomendaciones por género
      - Sugerencias basadas en tus géneros favoritos y sus etiquetas asociadas

      💎 VERSIÓN PREMIUM:
      - 100 recomendaciones por género

      📡 Esta función requiere una conexión a internet.
