    q9: "How do I unsubscribe from Premium?"
    a9: |-
      To cancel your active Premium subscription, follow the same steps as canceling the trial period:

      📱 On Android:
      1. Open the Google Play Store app
      2. Tap your profile picture in the top right
      3. Select Payments & subscriptions > Subscriptions
