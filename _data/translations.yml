  privacyPage:
    title: "Privacy Policy"
    intro:
      title: "Introduction"
      content: "Welcome to Book Nova's privacy policy. Protecting your privacy is essential to us. The app keeps most of your data on your device. If you accepted the “Contribute to statistics” setting (Settings > Data & Privacy), some data is shared through Firebase (Google Cloud), without your name, in particular to power reading recommendations. Other services receive data regardless of this setting: they are listed under “Data sharing”. A review is only published if you share it, book by book: see “Public reviews and the reviews account”."
    dataLocal:
      title: "Data stored locally on your device"
      intro: "The following information stays available offline on your device:"
      items:
        - "Personal library: titles, authors, page counts, cover images, descriptions, and reading progress (if you accepted “Contribute to statistics”, part of this is shared, see below)."
        - "Personal settings: height (optional, used only for playful stack visualization, never synced), display unit (cm/m), measurement system (metric/imperial), avatar, preferred reading languages, favourite genres, audiobook preference"
        - "Challenges & badges: selected challenge (solar/galaxy/universe), unlocked badges, and completion status"
        - "Book loans: books you lend or borrow, including dates and contacts"
        - "Interface preferences: app language (FR/EN/ES), theme (light/dark), library view type"
        - "Device identifier: a random identifier created by the app on the device, which also serves as your support number"
      note: "Data is shared without your name."
    usage:
      title: "Storage & processing"
      items:
        - "Local storage: data saved in AsyncStorage and SecureStore to guarantee offline access."
        - "Sharing: if you accepted “Contribute to statistics”, the app sends Firebase the data detailed in the next section."
        - "Hosting: Firebase data (Firestore and server functions) is hosted in the European Union."
    sync:
      title: "Sharing with “Contribute to statistics”"
      intro: "This data leaves your device only if you accepted the “Contribute to statistics” setting (Settings > Data & Privacy). It is shared without your name:"
      items:
        - "For each finished book with an ISBN (excluding your own cover photos), with no identifier, visible to all users on the Discover page, at most once a week: title, author, ISBN, cover, summary, language, page count, rating (stars), categories, hashtags, and the total readers and ratings."
        - "From version 1.39.0, per book, with no identifier, at most once a day: the number of readers by status (in progress, abandoned, to read, to buy) and the number of favourites."
        - "Per device, under its identifier: library size, number of finished books, number of books per genre (whole library, recorded every month), last activity, date you finished the app's welcome steps."
      purposesTitle: "Purpose of the processing:"
      purposes:
        - "Create recommendations of the most read, most popular, and best-rated books"
        - "Choose who receives reminders (welcome steps finished with no book added, no activity for 7 days or more), using library size, last activity and the date the welcome steps were finished"
        - "Understand reading trends by genre"
      retentionTitle: "Retention:"
      retention:
        - "As long as sharing stays active, then deletion on request. There is no automatic deletion."
        - "Total readers and ratings per book are kept, because they carry no identifier. Your share of reader counts by status and of favourites is withdrawn if you turn the setting off."
    api:
      title: "Book search: ISBNdb and Google Books"
      intro: "Book Nova fetches public book metadata when you:"
      items:
        - "Scan an ISBN barcode"
        - "Search by title"
        - "Enter an ISBN manually"
        - "Import a library from another app"
      routesTitle: "Where these searches go:"
      routes:
        - "An ISBN search goes first through a shared cache and a server function of our own (Firebase, European Union), which queries ISBNdb if needed. If that path is unavailable, or the scanned code is not a valid ISBN, it goes directly to ISBNdb."
        - "A title search goes directly to ISBNdb."
        - "If ISBNdb refuses or doesn't respond, the app falls back on Google Books."
      data: "Data sent to ISBNdb: the ISBN, or the searched text and the search language."
      limits: "Free users: up to 4 enriched books per day. Premium users: no limit."
      note: "When the app falls back on Google Books, it receives the ISBN, or the searched text and the search language."
    notifications:
      title: "Notifications"
      intro: "Local notifications, scheduled on your device, with no Internet connection:"
      items:
        - "Remind you of books lent and borrowed"
        - "Encourage reading (monthly reminder)"
        - "Warn you before the free trial ends"
      remoteTitle: "Remote notifications"
      remote: "As soon as you allow notifications, a token is stored with us in Firebase, along with the device identifier, platform, app version, and language, whether or not you accepted “Contribute to statistics”. It is used for reminders and announcements, sent through the Expo service. To avoid sending too many reminders, we also keep a record of those already sent: device identifier, reminder type, number sent and date of the last one."
      note: "Both local and remote notifications can be turned off in your phone's settings."
    premium:
      title: "Premium tier – RevenueCat"
      intro: "For in-app purchases, RevenueCat manages subscriptions. We only share with it:"
      items:
        - "Your device identifier: a random identifier created by the app on the device, which also serves as your support number"
        - "Subscription status (active/inactive)"
        - "Purchase transaction details handled by the App Store or Google Play"
      note: "Book Nova never accesses your payment information."
    messages:
      title: "Messages and suggestions"
      items:
        - "Contact form, sent by email: message type and text, email address and screenshots if you add them, support number, platform, app version and build number, system version."
        - "Feedback saved in Firebase, with no identifier: text, platform, app and system version, phone model. This includes free text typed into some welcome-step questions."
        - "Icon suggestions, saved in Firebase, with no identifier: text, platform, and app version."
    reviews:
      title: "Public reviews and the reviews account"
      intro: "Sharing a review is optional and done book by book: nothing is published unless you tap “Share my review with the community”. You must be 15 or older, or have a parent's permission."
      items:
        - "What is published, visible to all Book Nova users: the review's text, the rating out of 5 if you gave one, the month of reading, the spoiler mention, the publication and edit dates, and a pseudonym drawn at random (like “Owl 4271”). Neither your name, your support number nor your IP address is published."
        - "The reviews account: sharing a first review, or making a first report, creates an account with no name, no email and no password. It is managed by Firebase Authentication (Google), which processes its identifier, its creation and sign-in dates and the sign-in IP address in the United States."
        - "With each publication, the app also sends your support number: we only keep a fingerprint of it, which helps us recognise your account when you write to us with that number."
        - "Automatic check: when a review is published, its text is sent to Google Cloud Natural Language, in Europe, which detects insulting or hateful remarks."
        - "The author record, on our servers: your pseudonym, the version of the rules you accepted, the status and reason of each of your reviews and, where relevant, a suspension and the number of reports received. It is not deleted automatically."
        - "Reports: the reason, the details, and the name and email if the person reporting gives them, with the age of their account and a fingerprint of the start of their IP address. A reported or hidden review is kept with these reports in our moderation queue for up to 12 months after its last activity."
        - "The reviews log: for each publication, edit, deletion or restoration, the IP address, protocol, date, type of operation, review reference and account identifier, without the text. It is kept for one year."
        - "Anti-abuse limits count publications and reports per account and per fingerprint of the start of the IP address. These counters are deleted after two days."
        - "On your phone: the Final review and its sharing setting, the list of readers you hid, the list of spoilers you reported, and the tracking of your shared reviews. These lists are neither sent nor exported."
        - "Mixpanel receives measurements about reviews (text length, spoiler mention, reason for a refusal or a report), never their text."
      note: "A review stays online until you withdraw it. Uninstalling the app does not delete it: withdraw your reviews in Settings › Data & Privacy › My public reviews, one by one or all at once, or write to us. The reviews account is not deleted automatically: write to us to have it deleted."
      linkText: "How reviews work, in full:"
    sharing:
      title: "Data sharing"
      intro: "We don't sell or trade your data. We only pass it on in these cases:"
      items:
        - "Firebase (Google Cloud): hosting, in the European Union, of the data described on this page (shared statistics, public reviews and moderation, ISBN search, notification tokens, reminder records, feedback, icon suggestions)"
        - "Firebase Authentication (Google): the reviews account, processed in the United States"
        - "Google Cloud Natural Language: automatic check of review text, in Europe"
        - "ISBNdb: fetch public book metadata when you search"
        - "RevenueCat: manage the premium tier"
        - "Mixpanel: usage measurements under the device identifier, including answers to the welcome-step questions, favourite genres, book titles (for example a finished or shared book), collection and category names, and the content of a barcode that is not an ISBN. Sent to its European servers."
        - "Sentry: crash reports, performance measurements and technical context of the device, under its identifier. Sent to its European servers."
        - "TikTok: advertising attribution, under the device identifier: install, completion of the welcome steps, favourite genres chosen, trial and purchase (amount and currency). On Android, its SDK also reads the Google advertising ID."
        - "Google Books: book search"
        - "Expo: delivery of remote notifications and app updates"
        - "Web3Forms: contact form messages"
        - "ImgBB: screenshots attached to these messages, automatically deleted after 30 days"
        - "Legal obligations: when required by law"
      independent: "Mixpanel, Sentry, and TikTok do not depend on the “Contribute to statistics” setting: turning it off does not stop them."
      outsideEu: "Firebase Authentication processes the reviews account in the United States. TikTok, RevenueCat, ISBNdb, Google Books, Expo, Web3Forms, and ImgBB may process this data outside the European Union."
    website:
      title: "This website"
      items:
        - "TikTok pixel: every page of this site loads TikTok's advertising pixel. It records the page view and clicks towards the App Store and Google Play, to measure our ads."
        - "Cookie: if you arrive from a TikTok ad (link containing “ttclid”), that code is kept for 30 days in a cookie."
        - "Bootstrap: layout files are loaded from jsDelivr."
    security:
      title: "Security & storage"
      items:
        - "SecureStore encrypts your height and the device identifier using native iOS/Android security"
        - "Firebase encrypts synced data in transit and at rest (Google Cloud)"
        - "Firebase data (Firestore and server functions) is hosted in the European Union"
        - "Books, loans, and settings remain available offline on your device"
        - "Automatic backups rely on iCloud or Google Drive according to your OS settings"
      warning: "Important: deleting the app without a system backup permanently erases the data on your device."
    rights:
      title: "Your rights"
      consent: "The sharing choice in the app's welcome steps is explicit: nothing is pre-ticked. If you accepted sharing before version 1.39.0, the app asks you once again: until you confirm, your statuses and favourites are not counted."
      intro: "You can always:"
      items:
        - "View your data directly in the app"
        - "Edit information through the interface"
        - "Disable notifications via your device settings"
        - "Turn off “Contribute to statistics” (Settings > Data & Privacy): this stops sharing and removes the device's reading statuses and favourites from the counts, at the next launch if it is offline"
        - "Request deletion of the figures tied to the device by emailing book-nova@outlook.fr, with your support number (Settings > Support)"
        - "Withdraw your public reviews, one by one or all at once, in Settings › Data & Privacy › My public reviews"
        - "File a complaint with the CNIL"
      note: "Uninstalling the app erases the data on your phone, not what has already been shared. Before uninstalling, turn sharing off."
    permissions:
      title: "Requested permissions"
      items:
        - "Camera: scan ISBN barcodes and take photos (cover, loan, sharing)"
        - "Photos: pick an image (cover, screenshot attached to a message)"
        - "Notifications: show local reminders and receive remote reminders and announcements"
        - "Local storage: save books and preferences"
        - "Network access: search for books and exchange data with the services listed under “Data sharing”"
        - "Advertising ID (Android): TikTok advertising attribution"
      note: "Permissions are never used to collect data without your knowledge."
    changes:
      title: "Changes to this policy"
      content: "We may update this policy at any time. Please review it regularly."
    contact:
      title: "Contact"
      content: "Questions about your data or this policy? Reach us at:"
      email: "book-nova@outlook.fr"
    summary:
      title: "Quick summary"
      items:
        - "Your data stays available offline on your device"
        - "If you accept “Contribute to statistics” (nothing is pre-ticked), data is shared without your name through Firebase, where it is hosted in the European Union: per book with no identifier, per device under its identifier"
        - "This identifier is a random identifier created by the app on the device, which also serves as your support number"
        - "Mixpanel, Sentry, and TikTok do not depend on this setting and receive data under the device identifier"
        - "Book searches go through ISBNdb, through our server function for ISBN searches, and through Google Books as a fallback"
        - "RevenueCat handles premium, Expo delivers remote notifications and app updates, Web3Forms and ImgBB handle contact messages and their screenshots"
        - "TikTok, RevenueCat, ISBNdb, Google Books, Expo, Web3Forms, and ImgBB may process this data outside the European Union"
        - "Turning off the setting stops sharing and removes the device's reading statuses and favourites from the counts. The figures tied to the device are deleted on request at book-nova@outlook.fr, with the support number. You can file a complaint with the CNIL"
        - "This website loads TikTok's advertising pixel"
        - "A review is only published if you share it: it is public, signed with a pseudonym, and its account is managed by Firebase Authentication in the United States"
    lastUpdated: "Last updated: 04/11/2026"
