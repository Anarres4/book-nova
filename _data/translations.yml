    discoverPremium1: "100 recommandations par genre"
    discoverPremium2: "Suggestions basées sur vos genres favoris et leurs tags associés"
    discoverNote: "Cette fonctionnalité nécessite une connexion internet pour afficher les recommandations."
  notFound:
    title: "Page introuvable"
    message: "Nous n'avons pas pu trouver la page que vous cherchez."
    cta: "Retour à l'accueil"
  privacyPage:
    title: "Politique de Confidentialité"
    intro:
      title: "Introduction"
      content: "Bienvenue dans la politique de confidentialité de Book Nova. Nous accordons une grande importance à la protection de votre vie privée. L'application conserve la majorité de vos données sur votre appareil. Si vous avez accepté le réglage « Contribuer aux statistiques » (Paramètres > Données et confidentialité), certaines données sont partagées via Firebase (Google Cloud), sans votre nom, notamment pour proposer des recommandations de lecture. D'autres services reçoivent des données sans dépendre de ce réglage : ils sont listés dans « Partage des données ». Un avis n'est publié que si vous le partagez, livre par livre : voir « Avis publics et compte des avis »."
    dataLocal:
      title: "Données stockées localement sur votre appareil"
      intro: "Les informations suivantes restent accessibles hors ligne sur votre appareil :"
      items:
        - "Bibliothèque personnelle : titres, auteurs, nombre de pages, images de couverture, descriptions et progression de lecture (si vous avez accepté « Contribuer aux statistiques », une partie est partagée, voir plus bas)."
        - "Paramètres personnels : taille (optionnelle, utilisée uniquement pour la visualisation ludique de votre pile de livres, jamais synchronisée), unité d'affichage (cm/m), système métrique (métrique/impérial), avatar, langues de lecture préférées, genres favoris, préférence pour les livres audio"
        - "Défis et badges : défi sélectionné (solaire/galaxie/univers), badges débloqués et progression"
        - "Prêts de livres : livres prêtés ou empruntés, avec dates et contacts"
        - "Préférences d'interface : langue de l'application (FR/EN/ES), thème (clair/sombre), type de vue de bibliothèque"
        - "Identifiant de l'appareil : un identifiant aléatoire créé par l'app sur l'appareil, qui sert aussi de numéro de support"
      note: "Les données partagées le sont sans votre nom."
    usage:
      title: "Stockage et traitement"
      items:
        - "Stockage local : données enregistrées dans AsyncStorage et SecureStore pour garantir l'accès hors ligne."
        - "Partage : si vous avez accepté « Contribuer aux statistiques », l'application envoie à Firebase les données détaillées dans la section suivante."
        - "Hébergement : les données Firebase (Firestore et fonctions serveur) sont hébergées dans l'Union européenne."
    sync:
      title: "Partage avec « Contribuer aux statistiques »"
      intro: "Ces données partent seulement si vous avez accepté le réglage « Contribuer aux statistiques » (Paramètres > Données et confidentialité). Elles sont partagées sans votre nom :"
      items:
        - "Pour chaque livre terminé qui a un ISBN (hors photos de couverture personnelles), sans identifiant, visible par tous les utilisateurs sur la page Découvrir, au plus une fois par semaine : titre, auteur, ISBN, couverture, résumé, langue, nombre de pages, note (étoiles), catégories, hashtags, et les totaux de lecteurs et de notes."
        - "À partir de la version 1.39.0, par livre, sans identifiant, au plus une fois par jour : le nombre de lecteurs par statut (en cours, abandonné, à lire, à acheter) et le nombre de favoris."
        - "Par appareil, sous son identifiant : taille de la bibliothèque, nombre de livres terminés, nombre de livres par genre (toute la bibliothèque, relevé chaque mois), dernière activité, date de fin de l'accueil dans l'app."
      purposesTitle: "Finalités du traitement :"
      purposes:
        - "Créer des recommandations des livres les plus lus, populaires et les mieux notés"
        - "Choisir à qui envoyer des rappels (accueil terminé sans livre ajouté, aucune activité depuis 7 jours ou plus), à partir de la taille de la bibliothèque, de la dernière activité et de la date de fin de l'accueil"
        - "Comprendre les tendances de lecture par genre"
      retentionTitle: "Conservation :"
      retention:
        - "Tant que le partage reste actif, puis suppression sur demande. Il n'y a aucune suppression automatique."
        - "Les totaux de lecteurs et de notes par livre sont conservés, car ils ne portent pas d'identifiant. Votre part dans les nombres de lecteurs par statut et de favoris est retirée si vous coupez le réglage."
    api:
      title: "Recherche de livres : ISBNdb et Google Books"
      intro: "Book Nova récupère les métadonnées publiques des livres lorsque vous :"
      items:
        - "Scannez un code-barres ISBN"
        - "Effectuez une recherche par titre"
        - "Validez manuellement un ISBN"
        - "Importez une bibliothèque depuis une autre application"
      routesTitle: "Par où passent ces recherches :"
      routes:
        - "Une recherche par ISBN passe d'abord par un cache partagé et une fonction serveur à nous (Firebase, Union européenne), qui interroge ISBNdb si besoin. Si ce chemin n'est pas disponible, ou si le code scanné n'est pas un ISBN valide, elle part directement vers ISBNdb."
        - "Une recherche par titre part directement vers ISBNdb."
        - "Si ISBNdb refuse ou ne répond pas, l'app se replie sur Google Books."
      data: "Données envoyées à ISBNdb : l'ISBN, ou le texte recherché et la langue de recherche."
      limits: "Utilisateurs gratuits : jusqu'à 4 livres enrichis par jour. Utilisateurs premium : aucune limite."
      note: "Quand l'app se replie sur Google Books, il reçoit l'ISBN, ou le texte recherché et la langue de recherche."
    notifications:
      title: "Notifications"
      intro: "Notifications locales, programmées sur votre appareil, sans connexion Internet :"
      items:
        - "Rappeler les livres prêtés et empruntés"
        - "Vous encourager à lire (rappel mensuel)"
        - "Vous prévenir avant la fin de l'essai gratuit"
      remoteTitle: "Notifications à distance"
      remote: "Dès que vous autorisez les notifications, un jeton est enregistré chez nous dans Firebase, avec l'identifiant de l'appareil, la plateforme, la version de l'app et la langue, que vous ayez accepté ou non « Contribuer aux statistiques ». Il sert aux rappels et aux annonces, envoyés par le service Expo. Pour ne pas envoyer trop de rappels, nous gardons aussi la trace de ceux déjà envoyés : identifiant de l'appareil, type de rappel, nombre d'envois et date du dernier."
      note: "Les notifications, locales comme à distance, se coupent dans les réglages de votre téléphone."
    premium:
      title: "Version premium - RevenueCat"
      intro: "Lors d'achats in-app, RevenueCat gère vos abonnements. Nous lui transmettons uniquement :"
      items:
        - "L'identifiant de votre appareil : un identifiant aléatoire créé par l'app sur l'appareil, qui sert aussi de numéro de support"
        - "Statut d'abonnement (actif/inactif)"
        - "Informations de transaction fournies par l'App Store ou Google Play"
      note: "Book Nova n'accède jamais à vos informations de paiement."
    messages:
      title: "Messages et suggestions"
      items:
        - "Formulaire de contact, transmis par e-mail : type de message et texte, e-mail et captures d'écran si vous en ajoutez, numéro de support, plateforme, version et numéro de build de l'app, version du système."
        - "Retours enregistrés dans Firebase, sans identifiant : texte, plateforme, version de l'app et du système, modèle du téléphone. Cela comprend le texte libre saisi dans certaines questions de l'accueil."
        - "Suggestions d'icônes, enregistrées dans Firebase, sans identifiant : texte, plateforme et version de l'app."
    reviews:
      title: "Avis publics et compte des avis"
      intro: "Partager un avis est facultatif et se fait livre par livre : rien n'est publié sans que vous touchiez « Partager mon avis avec la communauté ». Il faut avoir 15 ans ou plus, ou l'accord d'un parent."
      items:
        - "Ce qui est publié, visible par tous les utilisateurs de Book Nova : le texte de l'avis, la note sur 5 si vous en avez donné une, le mois de lecture, la mention spoiler, les dates de publication et de modification, et un pseudonyme tiré au hasard (comme « Hibou 4271 »). Ni votre nom, ni votre numéro de support, ni votre adresse IP ne sont publiés."
        - "Le compte des avis : partager un premier avis, ou faire un premier signalement, crée un compte sans nom, sans e-mail et sans mot de passe. Il est géré par Firebase Authentication (Google), qui traite son identifiant, ses dates de création et de connexion et l'adresse IP de connexion aux États-Unis."
        - "À chaque publication, l'app envoie aussi votre numéro de support : nous n'en gardons qu'une empreinte, qui nous sert à reconnaître votre compte quand vous nous écrivez avec ce numéro."
        - "Le contrôle automatique : au moment de sa publication, le texte de chaque avis est envoyé à Google Cloud Natural Language, en Europe, qui repère les propos insultants ou haineux."
        - "Le dossier de l'auteur, sur nos serveurs : votre pseudonyme, la version des règles que vous avez acceptée, l'état et le motif de chacun de vos avis et, le cas échéant, une suspension et le nombre de signalements reçus. Il n'est pas supprimé automatiquement."
        - "Les signalements : le motif, les précisions, et le nom et l'e-mail si la personne qui signale les donne, avec l'âge de son compte et une empreinte du début de son adresse IP. Un avis signalé ou masqué est gardé avec ces signalements dans notre file de modération jusqu'à 12 mois après sa dernière activité."
        - "Le journal des avis : pour chaque publication, modification, suppression ou rétablissement, l'adresse IP, le protocole, la date, la nature de l'opération, la référence de l'avis et l'identifiant du compte, sans le texte. Il est conservé un an."
        - "Les limites contre les abus comptent les publications et les signalements par compte et par empreinte du début de l'adresse IP. Ces compteurs sont effacés après deux jours."
        - "Sur votre téléphone : la Note finale et son réglage de partage, la liste des lecteurs que vous avez masqués, celle des spoilers que vous avez signalés, et le suivi de vos avis partagés. Ces listes ne sont ni envoyées ni exportées."
        - "Mixpanel reçoit des mesures sur les avis (longueur du texte, mention spoiler, motif d'un refus ou d'un signalement), jamais leur texte."
      note: "Un avis reste en ligne jusqu'à ce que vous le retiriez. Désinstaller l'app ne le supprime pas : retirez vos avis dans Paramètres › Données et confidentialité › Mes avis publics, un par un ou tous à la fois, ou écrivez-nous. Le compte des avis n'est pas supprimé automatiquement : écrivez-nous pour le faire supprimer."
      linkText: "Le fonctionnement complet des avis :"
    sharing:
      title: "Partage des données"
      intro: "Nous ne vendons ni n'échangeons vos données. Nous les transmettons uniquement dans les cas suivants :"
      items:
        - "Firebase (Google Cloud) : hébergement, dans l'Union européenne, des données décrites sur cette page (statistiques partagées, avis publics et modération, recherche par ISBN, jetons de notification, suivi des rappels, retours, suggestions d'icônes)"
        - "Firebase Authentication (Google) : compte des avis, traité aux États-Unis"
        - "Google Cloud Natural Language : contrôle automatique du texte des avis, en Europe"
        - "ISBNdb : récupération des métadonnées publiques des livres lors de vos recherches"
        - "RevenueCat : gestion de la version premium"
        - "Mixpanel : mesures d'usage sous l'identifiant de l'appareil, dont les réponses aux questions de l'accueil, les genres favoris, des titres de livres (par exemple un livre terminé ou partagé), des noms de collections et de catégories, et le contenu d'un code-barres qui n'est pas un ISBN. Envoi vers ses serveurs européens."
        - "Sentry : rapports de plantage, mesures de performance et contexte technique de l'appareil, sous son identifiant. Envoi vers ses serveurs européens."
        - "TikTok : attribution publicitaire, sous l'identifiant de l'appareil : installation, fin de l'accueil, genres favoris choisis, essai et achat (montant et devise). Sur Android, son SDK lit aussi l'identifiant publicitaire Google."
        - "Google Books : recherche de livres"
        - "Expo : acheminement des notifications à distance et mises à jour de l'application"
        - "Web3Forms : messages du formulaire de contact"
        - "ImgBB : captures d'écran jointes à ces messages, supprimées automatiquement après 30 jours"
        - "Obligations légales : si la loi l'exige"
      independent: "Mixpanel, Sentry et TikTok ne dépendent pas du réglage « Contribuer aux statistiques » : le couper ne les arrête pas."
      outsideEu: "Firebase Authentication traite le compte des avis aux États-Unis. TikTok, RevenueCat, ISBNdb, Google Books, Expo, Web3Forms et ImgBB peuvent traiter ces données hors de l'Union européenne."
    website:
      title: "Ce site web"
      items:
        - "Pixel TikTok : chaque page de ce site charge le pixel publicitaire de TikTok. Il enregistre la page vue et les clics vers l'App Store et Google Play, pour mesurer nos publicités."
        - "Cookie : si vous arrivez depuis une publicité TikTok (lien avec « ttclid »), ce code est gardé 30 jours dans un cookie."
        - "Bootstrap : des fichiers de mise en page sont chargés depuis jsDelivr."
    security:
      title: "Sécurité et stockage"
      items:
        - "SecureStore protège votre taille et l'identifiant de l'appareil avec le chiffrement natif iOS/Android"
        - "Firebase applique le chiffrement en transit et au repos pour les données synchronisées (Google Cloud)"
        - "Les données Firebase (Firestore et fonctions serveur) sont hébergées dans l'Union européenne"
        - "Vos livres, prêts et paramètres restent consultables hors ligne sur votre appareil"
        - "Les sauvegardes iCloud ou Google Drive s'appliquent selon vos réglages système"
      warning: "Important : supprimer l'application sans sauvegarde système efface définitivement les données de votre appareil."
    rights:
      title: "Vos droits"
      consent: "Le choix du partage à l'accueil de l'app est explicite : rien n'est pré-coché. Si vous aviez accepté le partage avant la version 1.39.0, l'app vous repose la question une fois : tant que vous n'avez pas confirmé, vos statuts et vos favoris ne sont pas comptés."
      intro: "Vous pouvez à tout moment :"
      items:
        - "Consulter vos données directement dans l'application"
        - "Modifier vos informations par l'interface"
        - "Retirer votre consentement aux notifications dans les réglages de votre appareil"
        - "Couper « Contribuer aux statistiques » (Paramètres > Données et confidentialité) : cela arrête le partage et retire du décompte les statuts de lecture et les favoris de l'appareil, au prochain lancement s'il est hors ligne"
        - "Demander la suppression des chiffres rattachés à l'appareil en écrivant à book-nova@outlook.fr, avec votre numéro de support (Paramètres > Support)"
        - "Retirer vos avis publics, un par un ou tous à la fois, dans Paramètres › Données et confidentialité › Mes avis publics"
        - "Déposer une réclamation auprès de la CNIL"
      note: "Désinstaller l'application efface les données du téléphone, pas ce qui a déjà été partagé. Avant de désinstaller, coupez le partage."
    permissions:
      title: "Permissions demandées"
      items:
        - "Caméra : scanner les codes-barres ISBN et prendre des photos (couverture, prêt, partage)"
        - "Photos : choisir une image (couverture, capture jointe à un message)"
        - "Notifications : afficher les rappels locaux et recevoir les rappels et annonces à distance"
        - "Stockage local : enregistrer vos livres et paramètres"
        - "Accès réseau : rechercher des livres et échanger avec les services listés dans « Partage des données »"
        - "Identifiant publicitaire (Android) : attribution publicitaire TikTok"
      note: "Ces permissions ne servent jamais à collecter des données à votre insu."
    changes:
      title: "Modifications de cette politique"
      content: "Nous pouvons mettre à jour cette politique à tout moment. Consultez-la régulièrement."
    contact:
      title: "Contact"
      content: "Pour toute question relative à vos données ou à cette politique, écrivez-nous :"
      email: "book-nova@outlook.fr"
    summary:
      title: "Résumé simplifié"
      items:
        - "Vos données restent consultables hors ligne sur votre appareil"
        - "Si vous acceptez « Contribuer aux statistiques » (rien n'est pré-coché), des données sont partagées sans votre nom via Firebase, où elles sont hébergées dans l'Union européenne : par livre sans identifiant, par appareil sous son identifiant"
        - "Cet identifiant est un identifiant aléatoire créé par l'app sur l'appareil, qui sert aussi de numéro de support"
        - "Mixpanel, Sentry et TikTok ne dépendent pas de ce réglage et reçoivent des données sous l'identifiant de l'appareil"
        - "Les recherches de livres passent par ISBNdb, par notre fonction serveur pour les recherches par ISBN, et par Google Books en repli"
        - "RevenueCat gère la version premium, Expo achemine les notifications à distance et les mises à jour, Web3Forms et ImgBB traitent les messages de contact et leurs captures d'écran"
        - "TikTok, RevenueCat, ISBNdb, Google Books, Expo, Web3Forms et ImgBB peuvent traiter ces données hors de l'Union européenne"
        - "Couper le réglage arrête le partage et retire du décompte les statuts de lecture et les favoris de l'appareil. Les chiffres rattachés à l'appareil se suppriment sur demande à book-nova@outlook.fr, avec le numéro de support. Vous pouvez déposer une réclamation auprès de la CNIL"
        - "Ce site charge le pixel publicitaire de TikTok"
        - "Un avis n'est publié que si vous le partagez : il est public, signé d'un pseudonyme, et son compte est géré par Firebase Authentication aux États-Unis"
    lastUpdated: "Dernière mise à jour : 04/11/2026"
    backToHome: "Retour à l'accueil"
  reviewsPage:
    title: "Comment fonctionnent les avis"
    intro: "Cette page explique comment fonctionnent les avis publics de Book Nova : d'où ils viennent, comment ils sont contrôlés et affichés, combien de temps ils restent en ligne, et comment les signaler."
    origin:
      title: "D'où viennent les avis"
      items:
        - "Un avis est la Note finale d'un livre que son auteur a classé « Lu », et qu'il a choisi de partager, livre par livre, avec « Partager mon avis avec la communauté »."
        - "Pour partager, le livre doit avoir un ISBN et une date de fin de lecture, et l'avis au moins 20 caractères. Il faut accepter les règles ci-dessous et avoir 15 ans ou plus, ou l'accord d'un parent."
        - "Un lecteur publie au plus un avis par livre. Les avis sont rattachés au titre et à l'auteur du livre : les éditions qui portent le même titre partagent les mêmes avis, et une traduction au titre différent a les siens."
        - "Partager un avis est gratuit, en version gratuite comme en premium."
      note: "Ni la lecture ni l'achat du livre ne sont vérifiés. Aucun avis n'est rémunéré ni récompensé, et nous n'écrivons pas d'avis à la place des lecteurs."
    display:
      title: "Ce qui est affiché"
      items:
        - "Sur la fiche d'un livre, dans Découvrir, sous « Avis des lecteurs » : le texte, la note sur 5 si l'auteur en a donné une, le mois de lecture, la date de publication, la mention « modifié » si le texte ou la note a changé, et le pseudonyme de l'auteur."
        - "Le pseudonyme est tiré au hasard, comme « Hibou 4271 ». Il reste le même pour tous les avis d'un lecteur tant qu'il garde son compte : une réinstallation, ou « Repartir d'un compte neuf », en tire un nouveau. Il ne contient ni son nom ni son numéro de support."
        - "Tri : sur la fiche, votre avis d'abord, puis les plus récents ; dans « Voir les N avis », tous les avis, le vôtre compris, du plus récent au plus ancien. « Masquer les spoilers » retire de cette liste les avis qui en contiennent."
        - "Un avis marqué comme spoiler, par son auteur ou après un signalement, reste en ligne, mais son texte ne s'affiche qu'après « Afficher quand même »."
        - "Il n'est pas possible de contacter l'auteur d'un avis depuis Book Nova."
    control:
      title: "Le contrôle avant publication"
      intro: "Chaque avis passe un contrôle automatique au moment de sa publication, sans relecture préalable par une personne. Il est refusé s'il :"
      items:
        - "fait moins de 20 caractères ou plus de 2 000 ;"
        - "contient un lien, une adresse e-mail, un @pseudo, un numéro de téléphone, un numéro de support ou une suite de 9 chiffres ou plus, ISBN compris ;"
        - "contient un caractère invisible qui inverse le sens du texte ;"
        - "contient des propos insultants ou haineux, repérés par un filtre automatique (Google Cloud Natural Language, en Europe) ;"
        - "n'a pas de date de fin de lecture, ou porte sur un livre qui ne peut pas recevoir d'avis."
      note: "Un refus n'est jamais silencieux : l'app en affiche le motif, et votre texte n'est jamais modifié. Le filtre ne distingue pas une insulte à un personnage d'une insulte à une personne : les deux sont refusées. Pour éviter les abus, un même compte peut publier ou modifier au plus 5 avis par heure et 20 par jour, et un compte suspendu ne peut plus publier."
    delays:
      title: "Délais de publication et de conservation"
      items:
        - "Publication : dès que l'avis passe le contrôle automatique. Sans réseau, il part au retour de la connexion ; si le contrôle est momentanément indisponible, l'app réessaie plus tard."
        - "Conservation : un avis publié reste en ligne jusqu'à ce que son auteur le retire, sans limite de durée. Désinstaller l'app ne le supprime pas."
        - "Un avis signalé, masqué ou retiré par la modération est gardé dans notre file de modération jusqu'à 12 mois après sa dernière activité, pour permettre une contestation."
        - "Un journal de chaque publication, modification et suppression (adresse IP, date, nature de l'opération, identifiant du compte, sans le texte) est conservé un an."
    edit:
      title: "Modifier ou retirer son avis"
      items:
        - "Modifier : changez votre Note finale ou les étoiles du livre, puis enregistrez. Sur la fiche, le menu « … » de votre avis propose aussi « Modifier » et « Marquer comme spoiler ». L'avis en ligne est remplacé après un nouveau contrôle automatique."
        - "Un avis masqué par la modération reste masqué après une modification : il repasse en vérification."
        - "Retirer : « Retirer » dans le menu « … » de votre avis ; touchez de nouveau le bouton de partage de la Note finale, puis enregistrez ; videz la Note finale ; supprimez le livre ; ou passez par Paramètres › Données et confidentialité › Mes avis publics, qui permet aussi de supprimer tous vos avis d'un coup."
        - "Votre Note finale reste toujours sur votre téléphone."
        - "Après une réinstallation ou sur un nouveau téléphone, l'app peut ne plus pouvoir retirer vos anciens avis, et votre numéro de support peut avoir changé : écrivez-nous avec votre pseudonyme et les livres concernés, et nous les retirerons."
    reports:
      title: "Signaler un avis ou un lecteur"
      intro: "Depuis le menu « … » d'un avis, vous pouvez signaler l'avis, signaler son auteur, ou masquer ses avis pour vous seul. Un lecteur masqué se rétablit dans Mes avis publics › Lecteurs masqués › « Ne plus masquer »."
      items:
        - "Motifs : spoiler, haine ou harcèlement, insulte ou contenu offensant, informations personnelles, spam ou publicité, faux avis, autre contenu illicite, autre."
        - "Vous pouvez ajouter des précisions, obligatoires pour « autre contenu illicite », ainsi que votre nom et votre adresse e-mail, facultatifs. Une case vous fait confirmer que vous signalez de bonne foi. Si vous laissez une adresse, nous vous répondons avec notre décision."
        - "Chaque signalement est examiné par une personne de notre équipe, sous 24 heures."
        - "En attendant, certains signalements masquent l'avis à titre provisoire : un spoiler signalé cache son texte ; des informations personnelles signalées masquent l'avis pour tous ; un autre abus le masque après les signalements de deux lecteurs différents. Seuls les comptes créés depuis plus de 24 heures déclenchent ce masquage. Un avis n'est retiré qu'après notre vérification."
        - "Signaler un lecteur ne masque rien : le signalement nous est transmis."
    decisions:
      title: "Décisions et contestation"
      items:
        - "Après vérification, nous rétablissons l'avis, le retirons, ou suspendons son auteur pour une durée donnée. Un avis rétabli ne peut plus être masqué automatiquement."
        - "L'auteur voit dans l'app pourquoi son avis est refusé, masqué ou retiré, et si la décision est automatique et provisoire."
        - "Il peut la contester avec le bouton « Contester », qui prépare un e-mail, ou en nous écrivant avec la référence de l'avis."
        - "L'auteur de l'avis comme la personne qui l'a signalé peuvent aussi saisir la justice."
    rules:
      title: "Les règles"
      items:
        - "Pas d'insultes ni de propos haineux, envers qui que ce soit, personnages compris."
        - "Pas d'informations personnelles, ni les vôtres ni celles des autres : ni nom, ni coordonnées, ni lien."
        - "Prévenez les lecteurs quand votre avis dévoile l'intrigue."
      note: "Ce sont les règles acceptées au premier partage. Les conditions d'utilisation de Book Nova s'appliquent aussi."
    ratings:
      title: "Les notes des livres"
      content: "La note moyenne et la répartition des notes d'une fiche Découvrir viennent des lecteurs qui ont terminé le livre et accepté « Contribuer aux statistiques ». Chaque appareil compte une fois par livre, sans votre nom. Chaque téléphone envoie ses notes au plus une fois par semaine, en Wi-Fi : une note peut mettre quelques jours à compter. Ces notes ne sont pas vérifiées non plus."
    contact:
      title: "Contenu illicite, urgences et contact"
      items:
        - "Pour signaler un contenu illicite, contester une décision, ou pour les autorités : book-nova@outlook.fr."
        - "En cas de menace pour la vie ou la sécurité de quelqu'un, appelez le 17 ou le 112."
        - "Pour signaler un contenu illicite aux autorités françaises : Pharos, sur internet-signalement.gouv.fr."
        - "Nous répondons en français, en anglais et en espagnol."
    links:
      title: "Pour aller plus loin"
    lastUpdated: "Dernière mise à jour : 05/11/2026"
    backToHome: "Retour à l'accueil"
  termsPage:
    title: "Conditions d'Utilisation"
    sections:
      acceptance:
        title: "1. Acceptation des Conditions"
        body: "En téléchargeant, installant ou utilisant l'application Book Nova (ci-après 'l'Application'), vous acceptez d'être lié par ces Conditions d'Utilisation. Si vous n'acceptez pas ces conditions, veuillez ne pas utiliser l'Application. Ces conditions s'appliquent à tous les utilisateurs, qu'ils utilisent la version gratuite ou la version premium."
      service:
        title: "2. Description du Service"
        body: "Book Nova est une application mobile de gestion de bibliothèque personnelle qui vous permet de :"
        items:
          - "Gérer votre collection de livres avec suivi de la progression de lecture"
          - "Visualiser la hauteur de votre pile de livres en fonction de votre taille"
          - "Scanner des codes-barres ISBN pour récupérer automatiquement les informations des livres"
          - "Suivre vos prêts et emprunts de livres"
          - "Créer des collections personnalisées, prendre des notes de lecture et rédiger une note finale sur les livres terminés"
          - "Débloquer des badges et relever des défis de lecture"
          - "Consulter des statistiques personnalisées et recevoir des recommandations mises à jour régulièrement"
        note: "L'Application fonctionne hors ligne pour la plupart des actions. Si vous avez accepté le réglage « Contribuer aux statistiques », elle partage certaines données via Firebase (Google Cloud), sans votre nom, notamment pour générer ces recommandations. Le détail figure dans la Politique de confidentialité."
      usage:
        title: "3. Utilisation de l'Application"
        allowed:
          title: "3.1 Utilisation Autorisée"
          body: "Vous vous engagez à utiliser Book Nova uniquement à des fins personnelles et légales, notamment pour :"
          items:
            - "Gérer votre bibliothèque personnelle"
            - "Suivre vos lectures et votre progression"
            - "Gérer vos prêts de livres à vos proches"
            - "Consulter vos statistiques et débloquer des badges"
        prohibited:
          title: "3.2 Utilisations Interdites"
          body: "Il est strictement interdit d'utiliser l'Application pour :"
          items:
            - "Violer des droits de propriété intellectuelle (piratage, partage illégal de contenus protégés)"
            - "Automatiser des requêtes massives vers l'API ISBNdb (scraping, abus de l'API)"
            - "Modifier, décompiler, désassembler ou créer des œuvres dérivées de l'Application"
            - "Contourner les limitations de la version gratuite (4 livres par jour)"
            - "Utiliser des outils tiers pour débloquer artificiellement des fonctionnalités premium"
            - "Endommager, désactiver ou surcharger l'Application ou l'API ISBNdb"
      userData:
        title: "4. Données et Contenu de l'Utilisateur"
        ownership:
          title: "4.1 Propriété de Vos Données"
          body: "Vous conservez tous les droits sur les données que vous saisissez dans l'Application, notamment :"
          items:
            - "Titres de livres, auteurs et notes personnelles"
            - "Informations sur vos prêts et emprunts"
            - "Progression de lecture et statistiques personnalisées"
            - "Avatar et paramètres personnalisés"
          note: "Vos données restent accessibles sur votre appareil. Ce qui est partagé, et avec qui, figure dans la Politique de confidentialité."
        responsibility:
          title: "4.2 Responsabilité du Contenu"
          body: "Vous êtes seul responsable de l'exactitude et de la légalité des informations saisies dans l'Application. Nous ne sommes pas responsables des erreurs de saisie ou des litiges liés aux prêts de livres entre utilisateurs."
        backup:
          title: "4.3 Sauvegarde de Vos Données"
          body: "L'Application stocke vos données localement. Nous vous recommandons de conserver vos propres sauvegardes iCloud/Google Drive. Désinstaller l'application efface les données du téléphone, pas ce qui a déjà été partagé : avant de désinstaller, coupez « Contribuer aux statistiques », puis écrivez-nous avec votre numéro de support pour supprimer les chiffres rattachés à votre appareil."
        reviews:
          title: "4.4 Avis Publics"
          body: "Vous pouvez partager la Note finale d'un livre terminé sous forme d'avis public, livre par livre. Partager un avis demande d'avoir 15 ans ou plus, ou l'accord d'un parent, et d'accepter les règles des avis."
          items:
            - "Licence : vous restez propriétaire de vos avis. En partageant un avis, vous autorisez Book Nova à l'afficher dans l'Application, gratuitement et sans exclusivité, tant qu'il est en ligne. Toute autre utilisation, hors de l'Application, demandera votre accord."
            - "Règles : pas d'insultes ni de propos haineux, envers qui que ce soit, personnages compris ; pas d'informations personnelles, ni les vôtres ni celles des autres ; prévenir les lecteurs quand l'avis dévoile l'intrigue. Sont aussi interdits les faux avis, la publicité et tout contenu illicite."
            - "Tolérance zéro : nous ne tolérons aucun contenu répréhensible ni aucun comportement abusif."
            - "Modération : un filtre automatique contrôle chaque avis avant sa publication, et les lecteurs peuvent signaler un avis ou son auteur. Nous pouvons masquer ou retirer un avis qui enfreint ces règles, et suspendre la publication d'un compte pour une durée donnée."
            - "Responsabilité : vous êtes responsable du contenu de vos avis."
            - "Retrait : vous pouvez retirer vos avis à tout moment. Désinstaller l'Application ne les supprime pas."
          note: "Le contrôle, les signalements, les délais et la contestation sont détaillés sur la page « Comment fonctionnent les avis »."
      isbndb:
        title: "5. API ISBNdb et Métadonnées"
        thirdParty:
          title: "5.1 Service Tiers"
          body: "Book Nova utilise l'API ISBNdb pour récupérer les métadonnées publiques des livres. Nous ne sommes pas responsables de :"
          items:
            - "La disponibilité ou les interruptions de l'API ISBNdb"
            - "L'exactitude des données fournies par ISBNdb"
        limits:
          title: "5.2 Limitations de la Version Gratuite"
          body: "Les utilisateurs de la version gratuite sont limités à 4 livres ajoutés par jour, 4 collections personnalisées, 3 notes de lecture et jusqu'à 3 prêts/emprunts simultanés. Le nombre total de livres et la note finale sur les livres terminés restent illimités. Les utilisateurs premium ne sont pas soumis à ces limites (collections personnalisées et notes de lecture illimitées)."
      accounts:
        title: "6. Comptes et Authentification"
        noAccount:
          title: "6.1 Pas de Compte Obligatoire"
          body: "L'Application ne nécessite pas la création d'un compte. Elle utilise un identifiant aléatoire créé par l'app sur l'appareil, qui sert aussi de numéro de support. Partager ou signaler un avis crée un compte des avis, sans nom, sans e-mail ni mot de passe, géré par Firebase Authentication."
        uuid:
          title: "6.2 Identifiant de l'Appareil (UUID)"
          body: "Cet identifiant aléatoire (UUID) est généré localement et sert notamment à :"
          items:
            - "Gérer votre statut d'abonnement premium via RevenueCat"
            - "Rattacher à votre appareil les statistiques partagées, si vous avez accepté « Contribuer aux statistiques »"
            - "Envoyer les notifications à distance, mesurer l'usage (Mixpanel), recevoir les rapports de plantage (Sentry) et attribuer les installations aux publicités (TikTok), que ce réglage soit accepté ou non"
          note: "Cet identifiant ne contient ni votre nom ni votre adresse e-mail. Il vous permet aussi de demander la suppression des chiffres rattachés à votre appareil."
      premium:
        title: "7. Abonnement Premium et Achats In-App"
        features:
          title: "7.1 Fonctionnalités Premium"
          body: "La version premium débloque :"
          items:
            - "Validations illimitées avec métadonnées via ISBNdb"
            - "Ajout de livres sans limite quotidienne"
            - "Collections personnalisées illimitées"
            - "Notes de lecture illimitées"
            - "Statistiques de lecture de base (par mois/par an)"
            - "Statistiques détaillées avancées"
            - "Accès à des challenges et médailles exclusifs."
            - "Accès illimité aux recommandations de la page Découvrir."
        trial:
          title: "7.2 Période d'essai"
          body: "La période d'essai gratuite de 14 jours n'est disponible qu'une seule fois par compte. Une fois utilisée, elle ne peut pas être réactivée."
        processing:
          title: "7.3 Traitement des Achats"
          body: "Les achats in-app sont traités par :"
          items:
            - "Apple App Store (iOS)"
            - "Google Play Store (Android)"
          note: "Ces achats sont soumis aux conditions générales des plateformes. RevenueCat gère vos abonnements en toute sécurité."
        refunds:
          title: "7.4 Politique de Remboursement"
          body: "Les demandes de remboursement doivent être adressées directement à Apple ou Google. Book Nova ne peut pas traiter les remboursements."
        cancellation:
          title: "7.5 Annulation de l'Abonnement"
          body: "Vous pouvez annuler votre abonnement à tout moment via vos paramètres Apple ou Google. L'annulation prend effet à la fin de la période en cours."
      notifications:
        title: "8. Notifications"
        body: "L'Application peut envoyer des notifications locales et, via le service Expo, des notifications à distance pour :"
        items:
          - "Rappeler les livres prêtés et empruntés"
          - "Vous encourager à utiliser l'Application (rappel mensuel)"
          - "Vous prévenir avant la fin de l'essai gratuit"
          - "Vous envoyer des rappels et des annonces (notifications à distance)"
        note: "Vous pouvez les désactiver dans les paramètres de votre appareil."
      intellectualProperty:
        title: "9. Propriété Intellectuelle"
        rights:
          title: "9.1 Droits sur l'Application"
          body: "L'Application, son code, son design, ses graphismes et son contenu sont la propriété exclusive de Book Nova et protégés par les lois sur la propriété intellectuelle."
        license:
          title: "9.2 Licence d'Utilisation"
          body: "Nous vous accordons une licence non exclusive, non transférable et révocable pour utiliser l'Application à des fins personnelles. Cette licence ne vous autorise pas à :"
          items:
            - "Copier, modifier ou distribuer l'Application"
            - "Utiliser l'Application à des fins commerciales sans accord"
            - "Extraire ou réutiliser des éléments (code, design, badges)"
        metadata:
          title: "9.3 Métadonnées de Livres"
          body: "Les métadonnées des livres proviennent de bases publiques comme ISBNdb et restent soumises aux droits de leurs propriétaires (éditeurs, auteurs)."
      liability:
        title: "10. Limitation de Responsabilité"
        asIs:
          title: "10.1 Fourniture 'en l'état'"
          body: "L'Application est fournie 'telle quelle', sans garantie expresse ou implicite. Nous ne garantissons pas que :"
          items:
            - "L'Application soit exempte d'erreurs ou de bugs"
            - "Le service soit disponible en permanence"
            - "Les données d'ISBNdb soient exactes ou à jour"
        limit:
          title: "10.2 Limitation de Responsabilité"
          body: "Dans la limite permise par la loi, Book Nova ne pourra être tenue responsable de :"
          items:
            - "La perte de données liée à une suppression ou panne d'appareil"
            - "Les litiges entre utilisateurs concernant les prêts de livres"
            - "Les inexactitudes des métadonnées fournies par ISBNdb"
            - "Les interruptions ou dysfonctionnements de l'API ISBNdb"
            - "Tout dommage indirect, consécutif ou punitif"
      modifications:
        title: "11. Modifications de l'Application et des Conditions"
        app:
          title: "11.1 Mises à Jour de l'Application"
          body: "Nous nous réservons le droit de :"
          items:
            - "Modifier, améliorer ou supprimer des fonctionnalités"
            - "Ajuster les limites de la version gratuite avec un préavis de 30 jours"
        terms:
          title: "11.2 Modifications des Conditions"
          body: "Nous pouvons modifier ces Conditions à tout moment. Les changements prendront effet dès leur publication dans l'Application ou sur notre site web."
          note: "L'utilisation continue de l'Application après modification vaut acceptation des nouvelles conditions."
      termination:
        title: "12. Résiliation"
        user:
          title: "12.1 Résiliation par l'Utilisateur"
          body: "Vous pouvez cesser d'utiliser l'Application à tout moment en la supprimant. Si vous avez un abonnement premium, pensez à l'annuler via Apple ou Google pour éviter les renouvellements."
      contact:
        title: "13. Contact"
        body: "Pour toute question concernant ces Conditions d'Utilisation, veuillez nous contacter à :"
        email: "book-nova@outlook.fr"
      jurisdiction:
        title: "14. Loi Applicable et Juridiction"
        body: "Les présentes Conditions d'Utilisation sont régies par le droit français. Tout litige relatif à leur interprétation ou leur exécution relève de la compétence exclusive des tribunaux français."
      generalProvisions:
        title: "15. Dispositions Générales"
        body: "Si une disposition de ces Conditions est jugée invalide ou inapplicable, les autres dispositions resteront pleinement en vigueur."
    summary:
      title: "Résumé Simplifié"
      items:
        - "Usage personnel et légal uniquement"
        - "Vos données restent consultables sur votre appareil ; si vous acceptez « Contribuer aux statistiques », certaines sont partagées via Firebase, sans votre nom"
        - "Version gratuite : 4 livres ajoutés par jour, nombre total de livres illimité"
        - "Version premium : ajouts quotidiens illimités"
        - "Achats via Apple/Google, remboursements via ces plateformes"
        - "Application fournie 'en l'état', responsabilité limitée"
        - "Pas de compte requis ; un identifiant aléatoire de l'appareil sert au premium, aux statistiques partagées, aux notifications, à la mesure d'usage et à l'attribution publicitaire"
        - "Avis publics : partagés seulement si vous le demandez, livre par livre, soumis aux règles des avis et retirables à tout moment"
