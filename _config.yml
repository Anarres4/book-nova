# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Book Nova
email: book-nova@outlook.fr
description: >- # this means to ignore newlines until "baseurl:"
  Votre compagnon de lecture intelligent pour découvrir, organiser et
  partager vos livres préférés. Disponible sur iOS et Android.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://book-nova.com" # Update with the production domain

# Branding
hero_image: "/assets/images/hero-logo.png"
og_image: "/assets/images/og-preview.png"
hero_image_webp: "/assets/images/hero-logo.webp"
logo: "/assets/images/hero-logo.png"

# Business
author: "Book Nova"
company_name: "Book Nova"
company_email: "book-nova@outlook.fr"
company_address: "Paris, France"

# Application metadata
app:
  name: "Book Nova"
  category: "MobileApplication"
  operating_systems:
    - "iOS"
    - "Android"
  price: "0"
  price_currency: "EUR"
  ios_url: "https://apps.apple.com/fr/app/book-nova/id6752571289"
  android_url: "https://play.google.com/store/apps/details?id=com.quantumash.bigbangbook.app"

# Outil de modération des avis (moderation.html, README « Outil de modération ») : la configuration
# web Firebase de la PROD, celle de l'app, publique par nature. Aucune restriction d'application sur
# cette clé : elle couperait Firestore pour toute l'app. La configuration DEV n'est que dans
# _config.dev.yml, ignoré par git ; la CI refuse de publier un site qui la contiendrait.
moderation:
  sdkVersion: "12.4.0" # le SDK web Firebase de l'app ; la CSP de la page n'autorise que lui
  functionsRegion: "europe-west1" # functions/src/reviews/callables.ts
  # Les seuls hôtes de couverture chargés (CSP et script) : ceux que produit l'app (ISBNdb, Google
  # Books, Open Library). books_analytics s'écrit sans compte : une autre adresse apprendrait à son
  # serveur quand un modérateur ouvre la file. Un autre hôte affiche l'initiale du titre.
  coverHosts:
    - "images.isbndb.com"
    - "books.google.com"
    - "books.googleusercontent.com"
    - "covers.openlibrary.org"
  firebase:
    apiKey: "AIzaSyDQsUU-N0S7SIW9INxeVUO5uzvWTeMtUVQ"
    authDomain: "book-nova-prod.firebaseapp.com"
    projectId: "book-nova-prod"
    messagingSenderId: "176379837545"
    appId: "1:176379837545:web:3f27a636c2a621edd5b6f8"

# Languages
languages: ["fr", "en", "es"]
default_lang: "fr"
exclude_from_localization: ["assets", "manifest.json", "robots.txt", "CNAME", "llms.txt", "feed.xml"]
parallel_localization: true
twitter_username:
github_username:

# Build settings
theme: minima
sass:
  sourcemap: never
plugins:
  - jekyll-feed
  - jekyll-polyglot
# jekyll-seo-tag removed: we generate our own meta tags with localized titles/descriptions
# jekyll-sitemap removed: replaced by custom sitemap.xml with hreflang annotations

# Defaults pour les metadata
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      title: "Book Nova — Transformez votre expérience de lecture"
      description: >-
        Book Nova est votre compagnon de lecture pour organiser votre bibliothèque,
        suivre vos progrès et découvrir de nouveaux livres sur iOS et Android.
      lang: "fr"

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
